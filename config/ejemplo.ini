# Configuración de ejemplo. Copiar a config/<nodo>.ini (ignorado por git) y adaptar.
# Los comentarios van en su propia línea: configparser no quita los comentarios al final de un valor.
# Solo rutas, direcciones y tiempos. Nunca claves ni contraseñas dentro del fichero.

[node]
# vision, robot o server
role = server
name = servidor
log_level = INFO

[server]
host = 0.0.0.0
# conducto 1: zona de visión. conducto 2: zona del robot
port_vision = 5001
port_robot = 5002

[tls]
# en claro hasta el hito H3; después, TLS mutuo con el módulo de src/pki
enabled = no
# certs/ no se versiona; la clave privada con permisos 600
ca = certs/ca.crt
cert = certs/servidor.crt
key = certs/servidor.key

[protocol]
version = 1
# latido cada heartbeat_s; el extremo se da por caído tras missed_beats sin recibir nada (P5)
heartbeat_s = 1
missed_beats = 3
# espera máxima de la confirmación de una orden (P4)
ack_timeout_s = 2
# duración máxima de una rutina del robot
order_timeout_s = 60
max_message_bytes = 1048576

[robot]
# KukaVarProxy en la zona del robot (tramo en claro interno)
# IP de la controladora pendiente de confirmar en el laboratorio
kvp_host = 10.172.21.201
kvp_port = 7000
# periodo de sondeo de las variables de fin de rutina
poll_ms = 200
# dirección del servidor intermedio vista desde la pasarela-R (conducto 2 = server.port_robot)
server_host = 127.0.0.1
# espera entre reintentos de conexión con el servidor
reconnect_s = 2
# variables globales de KRL provisionales; la tabla definitiva se cierra con Robótica en C1
var_order = ORDEN_PIEZA
var_class = CLASE_PIEZA
var_done = FIN_RUTINA

[web]
bind = 0.0.0.0
port = 8080
