<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
<title>PBL 1: formato de los mensajes (delimitación y sobre común)</title>
<rect width="900" height="700" fill="white"/>
<text x="450" y="28" font-size="18" text-anchor="middle" font-weight="bold" fill="#111">PBL 1: formato de los mensajes entre pasarelas y servidor</text>
<text x="30" y="66" font-size="16" text-anchor="start" font-weight="bold" fill="#111">A. Trama en el cable (P1): longitud delante, sin separadores</text>
<rect x="30" y="82" width="200" height="56" fill="#cfe2f3" stroke="#444" stroke-width="1.2"/>
<text x="130.0" y="108.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">longitud</text>
<text x="130.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">u32 big-endian, 4 B</text>
<rect x="230" y="82" width="640" height="56" fill="#d9ead3" stroke="#444" stroke-width="1.2"/>
<text x="550.0" y="108.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">payload</text>
<text x="550.0" y="124.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">JSON en UTF-8, longitud bytes</text>
<line x1="30" y1="138" x2="30" y2="146" stroke="#444" stroke-width="1.2"/>
<text x="30" y="160" font-size="11" text-anchor="start" font-weight="normal" fill="#111">0</text>
<line x1="230" y1="138" x2="230" y2="146" stroke="#444" stroke-width="1.2"/>
<text x="230" y="160" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">4</text>
<line x1="870" y1="138" x2="870" y2="146" stroke="#444" stroke-width="1.2"/>
<text x="870" y="160" font-size="11" text-anchor="end" font-weight="normal" fill="#111">4 + longitud</text>
<text x="30" y="182" font-size="12" text-anchor="start" font-weight="normal" fill="#444">La longitud no cuenta su propia cabecera. Si supera max_message_bytes (1 MiB) se cierra la conexión y se registra.</text>
<text x="30" y="224" font-size="16" text-anchor="start" font-weight="bold" fill="#111">B. Sobre JSON común de todos los mensajes</text>
<rect x="30" y="240" width="110" height="26" fill="#eeeeee" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="258" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">campo</text>
<rect x="140" y="240" width="90" height="26" fill="#eeeeee" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="258" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">tipo</text>
<rect x="230" y="240" width="170" height="26" fill="#eeeeee" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="258" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">presencia</text>
<rect x="400" y="240" width="470" height="26" fill="#eeeeee" stroke="#444" stroke-width="1.2"/>
<text x="635.0" y="258" font-size="13" text-anchor="middle" font-weight="bold" fill="#111">significado</text>
<rect x="30" y="266" width="110" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="283" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">v</text>
<rect x="140" y="266" width="90" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="283" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">int</text>
<rect x="230" y="266" width="170" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="283" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">obligatorio</text>
<rect x="400" y="266" width="470" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="408" y="283" font-size="12" text-anchor="start" font-weight="normal" fill="#111">versión del protocolo (P6)</text>
<rect x="30" y="290" width="110" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="307" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">type</text>
<rect x="140" y="290" width="90" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="307" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">str</text>
<rect x="230" y="290" width="170" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="307" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">obligatorio</text>
<rect x="400" y="290" width="470" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="408" y="307" font-size="12" text-anchor="start" font-weight="normal" fill="#111">HELLO, HEARTBEAT, PIECE_RESULT, ORDER...</text>
<rect x="30" y="314" width="110" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="331" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">id</text>
<rect x="140" y="314" width="90" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="331" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">int</text>
<rect x="230" y="314" width="170" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="331" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">obligatorio</text>
<rect x="400" y="314" width="470" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="408" y="331" font-size="12" text-anchor="start" font-weight="normal" fill="#111">creciente por emisor</text>
<rect x="30" y="338" width="110" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="355" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">ref</text>
<rect x="140" y="338" width="90" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="355" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">int</text>
<rect x="230" y="338" width="170" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="355" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">solo respuestas</text>
<rect x="400" y="338" width="470" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="408" y="355" font-size="12" text-anchor="start" font-weight="normal" fill="#111">id del mensaje al que responde</text>
<rect x="30" y="362" width="110" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="379" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">piece</text>
<rect x="140" y="362" width="90" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="379" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">str</text>
<rect x="230" y="362" width="170" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="379" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">mensajes de pieza</text>
<rect x="400" y="362" width="470" height="24" fill="#fce5cd" stroke="#444" stroke-width="1.2"/>
<text x="408" y="379" font-size="12" text-anchor="start" font-weight="normal" fill="#111">P&lt;AAAAMMDD&gt;-&lt;HHMMSS&gt;-&lt;nnn&gt; (P3)</text>
<rect x="30" y="386" width="110" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="403" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">ts</text>
<rect x="140" y="386" width="90" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="403" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">str</text>
<rect x="230" y="386" width="170" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="403" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">obligatorio</text>
<rect x="400" y="386" width="470" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="408" y="403" font-size="12" text-anchor="start" font-weight="normal" fill="#111">ISO 8601 UTC con milisegundos</text>
<rect x="30" y="410" width="110" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="85.0" y="427" font-size="12" text-anchor="middle" font-weight="normal" fill="#111" font-family="DejaVu Sans Mono, monospace">body</text>
<rect x="140" y="410" width="90" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="185.0" y="427" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">objeto</text>
<rect x="230" y="410" width="170" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="315.0" y="427" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">obligatorio</text>
<rect x="400" y="410" width="470" height="24" fill="white" stroke="#444" stroke-width="1.2"/>
<text x="408" y="427" font-size="12" text-anchor="start" font-weight="normal" fill="#111">contenido propio de cada tipo</text>
<text x="30" y="454" font-size="12" text-anchor="start" font-weight="normal" fill="#444">Naranja: campo condicional. Una respuesta lleva ref; todo mensaje de una pieza lleva piece (P3, R3).</text>
<text x="30" y="500" font-size="16" text-anchor="start" font-weight="bold" fill="#111">C. Recepción: el receptor acumula bytes y extrae mensajes completos</text>
<text x="30" y="542" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Un mensaje por lectura</text>
<rect x="230" y="524" width="60" height="28" fill="#cfe2f3" stroke="#444" stroke-width="1.2"/>
<text x="260.0" y="543.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">L1</text>
<rect x="290" y="524" width="250" height="28" fill="#d9ead3" stroke="#444" stroke-width="1.2"/>
<text x="415.0" y="543.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">M1</text>
<rect x="230" y="522" width="310" height="32" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="385.0" y="567" font-size="10" text-anchor="middle" font-weight="normal" fill="#c00">lectura 1</text>
<text x="30" y="604" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Mensaje fragmentado</text>
