<text x="30" y="666" font-size="12" text-anchor="start" font-weight="bold" fill="#111">Varios mensajes juntos</text>
<rect x="230" y="648" width="40" height="28" fill="#cfe2f3" stroke="#444" stroke-width="1.2"/>
<text x="250.0" y="667.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">L1</text>
<rect x="270" y="648" width="110" height="28" fill="#d9ead3" stroke="#444" stroke-width="1.2"/>
<text x="325.0" y="667.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">M1</text>
<rect x="380" y="648" width="40" height="28" fill="#cfe2f3" stroke="#444" stroke-width="1.2"/>
