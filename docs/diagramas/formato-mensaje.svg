<rect x="230" y="584" width="190" height="32" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="325.0" y="629" font-size="10" text-anchor="middle" font-weight="normal" fill="#c00">lectura 1</text>
<rect x="444" y="586" width="120" height="28" fill="#d9ead3" stroke="#444" stroke-width="1.2"/>
<text x="504.0" y="605.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#111">M1 (parte 2)</text>
<rect x="444" y="584" width="120" height="32" fill="none" stroke="#c00" stroke-width="1.5" stroke-dasharray="4 3"/>
